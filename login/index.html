<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetín Central UCV | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <h1>Cafetin Central</h1>
        <h2>Bienvenido</h2>
    </header>

    <main class="login-card">
        <div class="input-group">
            <label for="userInput">Usuario</label>
            <input type="text" id="userInput" placeholder="Ingrese su usuario">
        </div>

        <div class="input-group">
            <label for="passInput">Contraseña</label>
            <input type="password" id="passInput" placeholder="Ingrese su contraseña">
        </div>

        <button id="loginBtn">Iniciar Sesión</button>
        
        <p id="errorMessage" class="error-msg">Nombre de usuario o contraseña incorrectos.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
